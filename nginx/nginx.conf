# Nginx configuration file
# This is a basic configuration file for Nginx. It includes global settings and an HTTP block where logging and server configurations can be defined.

# Global settings
events {}

# Http block - Where logging and server configurations are defined

http {
    log_format json_combined escape=json
        '{"source_ip":"$remote_addr","timestamp":"$time_iso8601","method":"$request_method","path":"$request_uri","status":"$status","response_size":"$body_bytes_sent"}';

    access_log /var/log/nginx/hng-access.log json_combined;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Server block - Define server configurations here
    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://nextcloud:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}